<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Portfolio Quest</title>
  <link rel="stylesheet" href="/src/css/style.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      overflow: hidden;
    }

    .ship-preview{
        font-size: xx-large;
    }

    .enter-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .space-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .title {
      font-size: 4rem;
      font-weight: bold;
      background: linear-gradient(135deg, #00d4ff, #ff006e);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      margin-bottom: 2rem;
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.5)); }
      50% { filter: drop-shadow(0 0 40px rgba(0, 212, 255, 1)); }
    }

    .subtitle {
      font-size: 1.5rem;
      color: #a0a0a0;
      margin-bottom: 3rem;
      text-align: center;
    }

    .enter-btn {
      padding: 1.5rem 4rem;
      font-size: 1.5rem;
      background: linear-gradient(135deg, #00d4ff, #ff006e);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="space-bg" id="spaceBg"></div>

  <div class="enter-container">
    <div class="ship-preview">🚀</div>
    <h1 class="title">Space Portfolio Quest</h1>
    <p class="subtitle">Explore galaxies of creativity, skills, and projects</p>

    <button class="enter-btn" id="enterBtn">🚀 Launch Mission</button>

    <br><br><br>
    <div class="instructions">
      <div style="color: white;">⬆️⬇️⬅️➡️ Arrow Keys to Move</div>
      <div style="color: white;">SPACE to Boost Speed</div>
      <div style="color: white;">CLICK on Planet to Explore the Details</div>
      <div style="color: white;">M to Toggle Map</div>
    </div>
  </div>

  <script>
    const spaceBg = document.getElementById('spaceBg');
    for (let i = 0; i < 200; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.width = Math.random() * 3 + 1 + 'px';
      star.style.height = star.style.width;
      star.style.animationDelay = Math.random() * 2 + 's';
      spaceBg.appendChild(star);
    }

    document.getElementById('enterBtn').addEventListener('click', () => {
      window.location.href = './game.html';
    });
  </script>
</body>
</html>
